            <script>
    const RENEWAL_SUPABASE_URL = "https://erhfqlcfwjqehffxetbv.supabase.co";
    const RENEWAL_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyaGZxbGNmd2pxZWhmZnhldGJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTU4OTAsImV4cCI6MjA5NjE3MTg5MH0.Cq0tiB4NP17E5O_cB4dPNmFk_dl7FYxwQq75p4tlOZc";

    const DEMO_RENEWAL_TOKENS = {
      "demo1": {
        token: "demo1",
        tenant_name: "יוסי כהן",
        contract_end_date: "31/12/2026",
        building: "1",
        apartment: "4",
        room: "2"
      },
      "demo2": {
        token: "demo2",
        tenant_name: "נועם יוסף",
        contract_end_date: "15/01/2027",
        building: "17/1",
        apartment: "4",
        room: "2"
      }
    };

    let currentRenewalRecord = null;

    function getParam(name, fallback) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name) || fallback;
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function normalizeRenewalRecord(record) {
      return {
        token: (record && record.token) || "",
        name: (record && (record.tenant_name || record.name)) || "שוכר/ת",
        end: (record && (record.contract_end_date || record.end)) || "לא צוין",
        building: (record && record.building) || "",
        apartment: (record && record.apartment) || "",
        room: (record && record.room) || "",
        answer: (record && record.answer) || ""
      };
    }

    async function fetchRenewalRecordFromSupabase(token) {
      const url = RENEWAL_SUPABASE_URL + "/rest/v1/contract_renewal_responses?select=*&token=eq." + encodeURIComponent(token) + "&limit=1";

      const response = await fetch(url, {
        method: "GET",
        headers: {
          "apikey": RENEWAL_SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + RENEWAL_SUPABASE_ANON_KEY
        }
      });

      if (!response.ok) {
        const errorText = await response.text().catch(function() { return ""; });
        throw new Error("Supabase read failed: " + response.status + " " + errorText);
      }

      const rows = await response.json();
      return Array.isArray(rows) && rows.length ? rows[0] : null;
    }

    async function getRenewalSurveyData() {
      const token = getParam("t", "").trim();

      if (token && DEMO_RENEWAL_TOKENS[token]) {
        return normalizeRenewalRecord(DEMO_RENEWAL_TOKENS[token]);
      }

      if (token) {
        const record = await fetchRenewalRecordFromSupabase(token);
        if (record) return normalizeRenewalRecord(record);
      }

      return {
        token: "",
        name: getParam("name", "שוכר/ת"),
        end: getParam("end", "לא צוין"),
        building: getParam("building", ""),
        apartment: getParam("apartment", ""),
        room: getParam("room", ""),
        answer: ""
      };
    }

    function renderRenewalData(data) {
      currentRenewalRecord = data;

      const unitParts = [];
      if (data.building) unitParts.push("בניין " + data.building);
      if (data.apartment) unitParts.push("דירה " + data.apartment);
      if (data.room) unitParts.push("חדר " + data.room);

      setText("tenantName", data.name || "שוכר/ת");
      setText("contractEnd", data.end || "לא צוין");
      setText("unitInfo", unitParts.length ? unitParts.join(" | ") : "לא צוינה");
    }

    function showLoadError(message) {
      setText("tenantName", "שוכר/ת");
      setText("contractEnd", "לא צוין");
      setText("unitInfo", "לא צוינה");

      const resultBox = document.getElementById("resultBox");
      if (resultBox) {
        resultBox.className = "result show no-result";
        resultBox.innerHTML = message || "לא הצלחנו לטעון את פרטי הבקשה.";
      }
    }

    async function initPage() {
      try {
        setText("tenantName", "טוען...");
        setText("contractEnd", "טוען...");
        setText("unitInfo", "טוען...");

        const data = await getRenewalSurveyData();
        renderRenewalData(data);

        const logo = document.getElementById("brandLogo");
        if (logo) {
          logo.addEventListener("error", function() {
            logo.classList.add("is-hidden");
          });
        }
      } catch (error) {
        console.error(error);
        showLoadError("לא הצלחנו לטעון את פרטי הבקשה. נא לפנות לנועם.");
      }
    }

    function getAnswerLabel(answer) {
      if (answer === "yes") return "ממשיך/ה";
      if (answer === "no") return "לא ממשיך/ה";
      if (answer === "later") return "אחליט בקרוב";
      return "";
    }

    async function saveRenewalAnswerToSupabase(answer) {
      const token = getParam("t", "").trim();

      if (!token || token === "demo1" || token === "demo2") {
        return;
      }

      const response = await fetch(RENEWAL_SUPABASE_URL + "/rest/v1/contract_renewal_responses?token=eq." + encodeURIComponent(token), {
        method: "PATCH",
        headers: {
          "apikey": RENEWAL_SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + RENEWAL_SUPABASE_ANON_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          answer: answer,
          answered_at: new Date().toISOString(),
          updated_at: new Date().toISOString()
        })
      });

      if (!response.ok) {
        const errorText = await response.text().catch(function() { return ""; });
        throw new Error("Supabase answer save failed: " + response.status + " " + errorText);
      }
    }

    async function chooseAnswer(answer) {
      const resultBox = document.getElementById("resultBox");
      const actions = document.getElementById("actions");

      if (actions) actions.style.display = "none";

      try {
        await saveRenewalAnswerToSupabase(answer);

        resultBox.className = "result show";

        if (answer === "yes") {
          resultBox.classList.add("yes-result");
          resultBox.innerHTML = "תודה רבה!<br>סימנת שברצונך להמשיך לשנה נוספת.";
        }

        if (answer === "no") {
          resultBox.classList.add("no-result");
          resultBox.innerHTML = "תודה רבה על העדכון.<br>סימנת שאינך ממשיך/ה לשנה נוספת.";
        }

        if (answer === "later") {
          resultBox.classList.add("later-result");
          resultBox.innerHTML = "תודה רבה.<br>סימנת שתחליט/י בקרוב.";
        }

        localStorage.setItem("renewalDemoLastAnswer", JSON.stringify({
          answer: answer,
          answerLabel: getAnswerLabel(answer),
          answeredAt: new Date().toISOString(),
          pageUrl: window.location.href,
          token: getParam("t", "")
        }));
      } catch (error) {
        console.error(error);

        resultBox.className = "result show no-result";
        resultBox.innerHTML = "התשובה לא נשמרה. נא לנסות שוב או לפנות לנועם.";

        if (actions) actions.style.display = "";
      }
    }

    initPage();
  </script>
</body>
</html>
